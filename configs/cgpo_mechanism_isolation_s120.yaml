# CGPO mechanism-isolation diagnostic.
# Purpose: separate lean CIG, PPF, and OVO mechanisms before making
# paper-facing claims about the source of performance.
allowExperimentalAlgorithms: true
algorithms: ["CGPO"]
cgpoAblationVariants:
  - full
  - random_only
  - no_cig_edge_coupling
  - no_ppf_pressure
  - no_ovo_variation
  - no_ovo_fleet_coordination
cgpoTraceEnabled: true
runs: 3
generations: 300
population: 80
seed: 17
mode: fleet
fleetSizes: [1, 3]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 100
metricInterval: 50
resumeExistingRuns: true
maxWorkers: 4
