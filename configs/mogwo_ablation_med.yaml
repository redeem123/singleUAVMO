# Medium ablation test to confirm critical components.
mode: multi
allowExperimentalAlgorithms: true
scenarioSet: paper_medium
generations: 100
population: 40
runs: 5
computeMetrics: true
safeDist: 20.0
droneSize: 1.0
separationMin: 10.0
maxTurnDeg: 75.0
fleetSizes: [1, 2, 3]
seed: 11
gpuMode: off

extra:
  algorithms: ["MOGWO"]
  problemNames: ["c_100", "m_100", "s_120"]
  hardCollisionConstraint: true
  maxWorkers: 14
  nRep: 40
  resumeExistingRuns: false
