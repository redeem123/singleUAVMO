# Focused CMOSMA run matched to the CGPO_full and SEM-4D inspection protocol.
mode: fleet
scenarioSet: paper_medium
algorithms: ["CMOSMA"]
allowExperimentalAlgorithms: true
generations: 500
population: 100
runs: 1
