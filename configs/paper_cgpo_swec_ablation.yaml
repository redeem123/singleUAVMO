# Paper-grade CGPO ablation.
#
# Six conceptually-pure variants that isolate each published mechanism on top
# of the lean CGPO loop.
allowExperimentalAlgorithms: true
algorithms: ["CGPO"]
cgpoAblationVariants:
  - full
  - random_only
  - no_cig_edge_coupling
  - no_ppf_pressure
  - no_ovo_variation
  - no_ovo_fleet_coordination
cgpoTraceEnabled: true
runs: 30
generations: 500
population: 100
seed: 11
mode: fleet
fleetSizes: [1, 3, 5]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["c_100", "m_100", "s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 100
metricInterval: 10
resumeExistingRuns: true
maxWorkers: 14
