# Focused CGPO/SWEC inspection table run.
# Budget requested for manuscript table: population 40 x 500 generations x 1 run.
allowExperimentalAlgorithms: true
algorithms: ["CGPO"]
cgpoAblationVariants:
  - full
cgpoTraceEnabled: true
runs: 1
generations: 500
population: 40
seed: 11
mode: fleet
fleetSizes: [3, 8]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 40
metricInterval: 10
resumeExistingRuns: false
maxWorkers: 2
