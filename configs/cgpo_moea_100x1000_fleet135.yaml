# CGPO MOEA-style performance benchmark.
# Uses the paper-facing lean CGPO controls.
allowExperimentalAlgorithms: true
algorithms:
  - CGPO
runs: 1
generations: 1000
population: 100
seed: 11
mode: fleet
fleetSizes: [1, 3, 5]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["c_100", "m_100", "s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 100
metricInterval: 50
resumeExistingRuns: true
maxWorkers: 9
cgpoUsePpfPressure: true
cgpoUseOvoVariation: true
cgpoUseOvoCoordination: true
