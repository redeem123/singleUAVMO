# General full benchmark protocol shared across algorithms.
# By default this runs the benchmark-safe catalog; narrow or opt into
# experimental algorithms with --extra-json at the CLI.
mode: multi
scenarioSet: paper_medium
generations: 500
population: 100
runs: 30
safeDist: 20.0
droneSize: 1.0
separationMin: 10.0
maxTurnDeg: 75.0
fleetSizes: [1, 3, 5]
seed: 11
gpuMode: auto
problemNames: ["c_100", "m_100", "s_120"]
# These top-level keys are all passed into params.extra via BenchmarkParams.from_mapping().
hardCollisionConstraint: true
nRep: 100
maxWorkers: 14
