# Paper-grade CGPO comparison for the active SWEC/SWEVO manuscript direction.
#
# CGPO is the lean three-mechanism graph-aware MOEA: CIG + PPF + OVO on top
# of NSGA-II selection.
#
# Defaults from ``_AblationControls`` already match this protocol; the toggles
# below are kept as explicit assertions for fairness auditability.
allowExperimentalAlgorithms: true
algorithms:
  - CGPO
  - NSGA-II
  - MOEAD
  - NMOPSO
  - CCEA-ADVS
  - TSKAC-NSGA-II
  - DTAPP-IICR
runs: 30
generations: 500
population: 100
seed: 11
mode: fleet
fleetSizes: [1, 3, 5]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["c_100", "m_100", "s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 100
metricInterval: 10
resumeExistingRuns: true
maxWorkers: 14
# Three published mechanisms ON.
cgpoUseCigEdgeCoupling: true
cgpoUsePpfPressure: true
cgpoUseOvoVariation: true
cgpoUseOvoCoordination: true
