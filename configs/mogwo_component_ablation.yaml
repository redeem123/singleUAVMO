# Template protocol for fair MOGWO component ablation.
# This file is intentionally a template and does not launch runs by itself.

mode: multi
scenarioSet: paper_medium
generations: 500
population: 100
runs: 30
safeDist: 20.0
droneSize: 1.0
separationMin: 10.0
maxTurnDeg: 75.0
fleetSizes: [1, 3, 5]
seed: 11
gpuMode: off

extra:
  algorithms: ["MOGWO"]
  problemNames: ["c_100_uav1", "m_100_uav1", "s_120_uav1", "c_100_uav3", "m_100_uav3", "s_120_uav3", "c_100_uav5", "m_100_uav5", "s_120_uav5"]
  hardCollisionConstraint: true
  maxWorkers: 14
  nRep: 100
  resumeExistingRuns: false

