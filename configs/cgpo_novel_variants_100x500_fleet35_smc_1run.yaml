# Focused CGPO mechanism-variant run requested for inspection.
allowExperimentalAlgorithms: true
algorithms: ["CGPO"]
cgpoAblationVariants:
  - full
  - no_cig_edge_coupling
  - no_gfp_projection
  - no_ppf_pressure
  - no_ovo_coordination
cgpoTraceEnabled: true
cgpoGfpSteps: 2
cgpoGfpMaxStep: 0.08
runs: 1
generations: 500
population: 100
seed: 11
mode: fleet
fleetSizes: [3, 5]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["c_100", "m_100", "s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 100
metricInterval: 10
resumeExistingRuns: false
maxWorkers: 10
