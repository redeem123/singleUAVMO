# Fast ablation test to identify critical components.
mode: multi
allowExperimentalAlgorithms: true
scenarioSet: paper_medium
generations: 50
population: 40
runs: 3
computeMetrics: true
safeDist: 20.0
droneSize: 1.0
separationMin: 10.0
maxTurnDeg: 75.0
fleetSizes: [1]
seed: 11
gpuMode: off

extra:
  algorithms: ["MOGWO"]
  problemNames: ["c_100_uav1", "m_100_uav1", "s_120_uav1"]
  hardCollisionConstraint: true
  maxWorkers: 14
  nRep: 40
  resumeExistingRuns: false
