# Focused CGPO/SWEC ablation table run.
# Budget requested for manuscript table: population 40 x 500 generations x 1 run per variant.
allowExperimentalAlgorithms: true
algorithms: ["CGPO"]
cgpoAblationVariants:
  - full
  - random_only
  - no_cig_edge_coupling
  - no_ppf_pressure
  - no_ovo_variation
  - no_ovo_fleet_coordination
cgpoTraceEnabled: true
runs: 1
generations: 500
population: 40
seed: 11
mode: fleet
fleetSizes: [3]
separationMin: 10.0
maxTurnDeg: 75.0
safeDist: 20.0
droneSize: 1.0
scenarioSet: paper_medium
gpuMode: "off"
problemNames: ["s_120"]
computeMetrics: true
hardCollisionConstraint: true
nRep: 40
metricInterval: 10
resumeExistingRuns: false
maxWorkers: 3
